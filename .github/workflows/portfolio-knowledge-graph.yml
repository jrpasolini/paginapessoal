name: Portfolio knowledge graph smoke tests
on:
  push:
    branches:
      - feat/portfolio-grafo-semantico-20261025
  pull_request:
    paths:
      - 'assets/routes-release-20261013-r7.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/semantic-graph.test.mjs'
jobs:
  graph-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check curated graph behavior
        run: node --test tests/semantic-graph.test.mjs
